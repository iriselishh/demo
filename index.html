<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safarix</title>

<style>

body{
    margin:0;
    font-family: Arial, sans-serif;
}

/* Navigation bar */

nav{
    background-color:#222;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 40px;


    <nav class="navbar">
        <div class="logo">WILD<span>ROOTS</span></div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#destinations">Destinations</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#" class="btn-contact">Contact</a></li>
        </ul>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1>The Wild is Calling.</h1>
            <p>Experience the "Big Five" in their natural habitat with our expert-guided tours.</p>
            <button onclick="exploreAlert()">Start Your Journey</button>
        </div>
    </header>

    <section id="destinations" class="taxonomy-grid">
        <h2>Choose Your Experience</h2>
        <div class="container">
            <div class="card">
                <h3>Luxury Lodges</h3>
                <p>Five-star comfort in the heart of the savanna.</p>
                <button class="card-btn">View Details</button>
            </div>
            <div class="card">
                <h3>Photo Safaris</h3>
                <p>Capture the perfect shot with professional guides.</p>
                <button class="card-btn">View Details</button>
            </div>
            <div class="card">
                <h3>Family Camping</h3>
                <p>Safe, educational, and fun for all ages.</p>
                <button class="card-btn">View Details</button>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
